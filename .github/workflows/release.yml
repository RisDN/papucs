name: Release npm packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm run release:check -- "${{ github.event.release.tag_name }}"
      - run: npm run verify
      - run: npm run audit:content
      - run: npm run audit:licenses
      - run: npm audit --audit-level=high
      - run: npm publish --workspace papucs --access public --provenance
      - run: npm publish --workspace create-papucs --access public --provenance
